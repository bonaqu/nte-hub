<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>
        NTE Tier List
    </title>

    <link
            rel="stylesheet"
            href="../style.css"
    >

</head>

<body>

<div class="bg"></div>

<div class="layout">

    <aside class="sidebar">

        <div class="sidebarLogo">
            NTE HUB
        </div>

        <nav class="sidebarNav">

            <a href="../index.html">
                Characters
            </a>

            <a href="./tierlist.html">
                Tier List
            </a>

        </nav>

        <div class="filterSection">

            <h3>
                Role
            </h3>

            <button
                    onclick="filterRole('all')"
            >
                All
            </button>

            <button
                    onclick="filterRole('Burst DPS')"
            >
                Burst DPS
            </button>

            <button
                    onclick="filterRole('Support')"
            >
                Support
            </button>

        </div>

        <div class="filterSection">

            <h3>
                Attribute
            </h3>

            <button
                    onclick="filterAttribute('all')"
            >
                All
            </button>

            <button
                    onclick="filterAttribute('Chaos')"
            >
                Chaos
            </button>

            <button
                    onclick="filterAttribute('Psychic')"
            >
                Psychic
            </button>

        </div>

    </aside>

    <main class="tierPage">

        <div class="tierHero">

            <h1>
                Neverness to Everness Tier List
            </h1>

            <p>
                Community-driven production tier list.
            </p>

        </div>

        <div id="tierContainer"></div>

    </main>

</div>

<script src="../tierlist.js"></script>

</body>
</html>
