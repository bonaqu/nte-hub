<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>
        NTE Admin
    </title>

    <link
            rel="stylesheet"
            href="./style.css"
    >

</head>

<body>

<div class="bg"></div>

<div class="content">

    <h1>
        Admin Panel
    </h1>

    <p>
        Edit JSON manually for now.
    </p>

    <textarea
            style="
            width:100%;
            min-height:700px;
        "
            id="jsonEditor"
    ></textarea>

</div>

<script>

    async function loadJson(){

        const response =
            await fetch(
                "./characters.json"
            );

        const data =
            await response.text();

        document
            .getElementById(
                "jsonEditor"
            )
            .value = data;
    }

    loadJson();

</script>

</body>
</html>
