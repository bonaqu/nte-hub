<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>
        NTE HUB
    </title>

    <meta
            name="description"
            content="Neverness to Everness production fan hub with guides, tier lists, teams and builds."
    >

    <link
            rel="stylesheet"
            href="./style.css"
    >

    <link
            rel="preconnect"
            href="https://fonts.googleapis.com"
    >

    <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;800&display=swap"
            rel="stylesheet"
    >

</head>

<body>

<div class="bg"></div>

<header class="navbar">

    <div class="logo">
        NTE HUB
    </div>

    <div class="navSearch">

        <input
                id="searchInput"
                placeholder="Search character..."
        >

    </div>

</header>

<div class="layout">

    <aside class="sidebar">

        <div class="sidebarSection">

            <h3>
                Tier
            </h3>

            <button onclick="setTier('all')">
                All
            </button>

            <button onclick="setTier('S+')">
                S+
            </button>

            <button onclick="setTier('S')">
                S
            </button>

            <button onclick="setTier('A')">
                A
            </button>

        </div>

        <div class="sidebarSection">

            <h3>
                Role
            </h3>

            <button onclick="setRole('all')">
                All
            </button>

            <button onclick="setRole('Burst DPS')">
                Burst DPS
            </button>

            <button onclick="setRole('Support')">
                Support
            </button>

        </div>

        <div class="sidebarSection">

            <h3>
                Attribute
            </h3>

            <button onclick="setAttribute('all')">
                All
            </button>

            <button onclick="setAttribute('Chaos')">
                Chaos
            </button>

            <button onclick="setAttribute('Psychic')">
                Psychic
            </button>

        </div>

    </aside>

    <main class="content">

        <section class="hero">

            <div class="heroContent">

                <div class="chip">
                    LIVE DATABASE
                </div>

                <h1>
                    Neverness to Everness
                </h1>

                <p>
                    Production-level fan hub inspired by Prydwen.
                </p>

            </div>

        </section>

        <section>

            <div
                    id="charactersGrid"
                    class="charactersGrid"
            ></div>

        </section>

    </main>

</div>

<div
        id="overlay"
        class="overlay"
>

    <div class="overlayContent">

        <button
                class="closeButton"
                onclick="closeOverlay()"
        >
            ✕
        </button>

        <div id="overlayBody"></div>

    </div>

</div>

<script src="./app.js"></script>

</body>
</html>
