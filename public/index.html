<!DOCTYPE html>

<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>NTE HUB</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;800&display=swap"
            rel="stylesheet"
    >

</head>

<body>

<div class="bg"></div>

<header class="navbar">

    <div class="logo">
        NTE HUB
    </div>

    <nav>

        <a href="#">
            Characters
        </a>

        <a href="#">
            Tier List
        </a>

        <a href="#">
            Teams
        </a>

        <a href="#">
            Guides
        </a>

    </nav>

    <div class="navRight">

        <input
                id="searchInput"
                placeholder="Search character..."
        >

        <button onclick="toggleAdmin()">
            Admin
        </button>

    </div>

</header>

<section class="hero">

    <div class="heroContent">

        <div class="chip">
            LIVE DATABASE
        </div>

        <h1>
            Neverness to Everness
        </h1>

        <p>
            Production-level fan hub inspired by Prydwen.
        </p>

    </div>

</section>

<section class="section">

    <div class="sectionHeader">

        <h2>
            Characters
        </h2>

    </div>

    <div
            id="charactersGrid"
            class="charactersGrid"
    ></div>

</section>

<div
        id="characterModal"
        class="characterModal"
>

    <div class="modalContent">

        <button
                class="closeButton"
                onclick="closeModal()"
        >
            X
        </button>

        <div id="modalBody"></div>

    </div>

</div>

<div
        id="adminDrawer"
        class="adminDrawer"
>

    <div class="drawerHeader">

        <h2>
            Admin Panel
        </h2>

        <button onclick="toggleAdmin()">
            X
        </button>

    </div>

    <input
            id="charName"
            placeholder="Character name"
    >

    <textarea
            id="charDesc"
            placeholder="Description"
    ></textarea>

    <button onclick="addCharacter()">
        Publish
    </button>

</div>

<script src="app.js"></script>

</body>
</html>
